[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lonnrouter"
version = "0.2.0"
description = "Python SDK for the Lonn routing API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.9,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lonnrouter = ["py.typed"]
